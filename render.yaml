services:
  - type: web
    name: cimentbuild
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations store --noinput && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn shop.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cimentbuild-db
          property: connectionString
databases:
  - name: cimentbuild-db
