services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "change-me-in-production"
      DATABASE_URL: "postgresql://ciment:ciment@db:5432/cimentbuild"
      ALLOWED_HOSTS: "*"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cimentbuild
      POSTGRES_USER: ciment
      POSTGRES_PASSWORD: ciment
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
