{% extends "shop/base.html" %}{% block content %}<h1>Finaliser la commande</h1><form class="form" method="post">{% csrf_token %}<label>Nom complet<input name="customer_name" required></label><label>Téléphone<input name="phone" required placeholder="+228..."></label><label>Email (facultatif)<input type="email" name="email"></label><label>Ville<input name="city" value="Lomé"></label><label>Zone de livraison<select name="zone" required>{% for z in zones %}<option value="{{ z.id }}">{{ z.name }} — {{ z.fee }} FCFA</option>{% endfor %}</select></label><label>Adresse de livraison<textarea name="address" required></textarea></label><label>Mode de paiement<select name="payment_method"><option value="cash">Paiement à la livraison</option><option value="mobile">Paiement mobile</option><option value="online">Paiement en ligne</option></select></label><label>Note<textarea name="notes" placeholder="Indications pour le livreur..."></textarea></label><button class="btn">Confirmer la commande</button></form><h3>Total produits : {{ subtotal }} FCFA</h3>{% endblock %}
